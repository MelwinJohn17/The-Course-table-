<!-- Scale the fixed 1440x960 stage to any viewport -->
<script>
(function () {
  function fit() {
    const stage = document.getElementById("stage");
    if (!stage) return;
    const pad = 16;
    const vw = window.innerWidth - pad * 2;
    const vh = window.innerHeight - pad * 2;
    const s = Math.min(vw / 1440, vh / 960, 1.15);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
    stage.style.position = "absolute";
    stage.style.left = "50%";
    stage.style.top = "50%";
  }
  window.addEventListener("resize", fit);
  // fit continually until stage mounts
  const iv = setInterval(() => {
    if (document.getElementById("stage")) { fit(); clearInterval(iv); }
  }, 100);
  setTimeout(fit, 300);
})();
</script>
